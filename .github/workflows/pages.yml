name: Pages

# Renders documentation from fandyajpo/sendust and publishes it.
# A push to main pins SENDUST_REF; the daily run follows the latest release;
# workflow_dispatch can name any ref.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Sendust ref to render (default: the pinned ref)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SENDUST_REPOSITORY: fandyajpo/sendust
  # The ref every push to main publishes. Keep it in step with
  # scripts/doc-map.mjs (REPOSITORY.defaultRef).
  SENDUST_REF: v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Resolve the Sendust ref
        id: sendust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ref="$SENDUST_REF"
          if [ -n "${REQUESTED_REF:-}" ]; then
            ref="$REQUESTED_REF"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            latest="$(gh api "repos/$SENDUST_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ -n "${latest:-}" ]; then
              ref="$latest"
            else
              echo "::warning::No latest release found for $SENDUST_REPOSITORY; rendering $ref."
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Rendering documentation from $SENDUST_REPOSITORY@$ref"

      - name: Check out Sendust at that ref
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SENDUST_REPOSITORY }}
          ref: ${{ steps.sendust.outputs.ref }}
          path: sendust

      - name: Set up the pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare the toolchain
        run: |
          set -euo pipefail
          npm install --global npm@12.2.2 || echo "::warning::npm 12.2.2 is unavailable here; using the bundled npm."
          if [ ! -f package-lock.json ]; then
            echo "::warning::No package-lock.json committed; resolving dependencies for this build only."
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run, so no manual click in
          # Settings is needed for the deploy step to find it.
          enablement: true

      - name: Build and upload the site
        uses: withastro/action@v3
        env:
          SENDUST_PATH: ${{ github.workspace }}/sendust
          SENDUST_REF: ${{ steps.sendust.outputs.ref }}
        with:
          node-version: 22.23.5
          build-cmd: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
